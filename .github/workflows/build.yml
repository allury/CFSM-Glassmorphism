name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate dist
        run: bun run validate:dist

      - name: Resolve artifact name
        id: artifact
        shell: bash
        run: echo "file=CFSM-Glassmorphism-build-${GITHUB_SHA::7}.zip" >> "$GITHUB_OUTPUT"

      - name: Package theme
        working-directory: dist
        run: zip -r "../${{ steps.artifact.outputs.file }}" index.html assets

      - name: Upload theme archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.file }}
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error
          retention-days: 14
