name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.artifact.outputs.file }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate dist
        run: bun run validate:dist

      - name: Resolve artifact name
        id: artifact
        shell: bash
        run: echo "file=CFSM-Glassmorphism-build-${GITHUB_SHA::7}.zip" >> "$GITHUB_OUTPUT"

      - name: Package theme
        working-directory: dist
        run: zip -r "../${{ steps.artifact.outputs.file }}" index.html assets

      - name: Upload theme archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.file }}
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download verified theme archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: .

      - name: Prepare stable release archive
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e "console.log(require('./package.json').version)")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          release_file="CFSM-Glassmorphism-${package_version}.zip"
          mv "${{ needs.verify.outputs.artifact-name }}" "$release_file"
          echo "file=$release_file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.release.outputs.file }}#CFSM Glassmorphism theme archive"
          --verify-tag
          --latest
          --title "CFSM Glassmorphism $GITHUB_REF_NAME"
          --notes-file docs/releases/v1.0.0.md
